<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.35, maximum-scale=5.0, user-scalable=yes">
  <title>Regular Camp Tracker</title>
  <link rel="icon" type="image/png" href="../../00-build/database/favicon.png">
  <script src="../js/theme-preload.js"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/unified-components.css">
  <script src="../js/core.js" defer></script>
  <script src="../js/settings.js" defer></script>
  <script src="../js/unified-ui.js?v=team-abbreviations-1"></script>
  <style>
    :root {
      --tracker-max: #b42318;
      --tracker-used: #9a5b00;
    }

    body { margin: 0; }

    .tracker-shell { max-width: 1320px; }

    .tracker-banner-copy {
      display: flex;
      align-items: center;
      gap: .75rem;
      min-width: 0;
    }

    .tracker-banner-mark {
      display: grid;
      place-items: center;
      flex: 0 0 58px;
      width: 58px;
      height: 58px;
      border: 1px solid var(--ui-line);
      background: var(--ui-soft);
      color: var(--ui-team);
      font-size: .8rem;
      font-weight: 950;
      letter-spacing: .08em;
    }

    .tracker-summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: .5rem;
    }

    .tracker-metric {
      border: 1px solid var(--ui-line);
      border-top: 3px solid var(--ui-team);
      background: var(--ui-card);
      padding: .55rem .65rem;
    }

    .tracker-metric-label {
      display: block;
      color: var(--ui-muted);
      font-size: .61rem;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .tracker-metric-value {
      display: block;
      margin-top: .15rem;
      color: var(--ui-team);
      font-size: 1.35rem;
      font-weight: 950;
      line-height: 1;
    }

    .tracker-metric--max { border-top-color: var(--tracker-max); }
    .tracker-metric--max .tracker-metric-value { color: var(--tracker-max); }

    .tracker-filters {
      display: grid;
      grid-template-columns: minmax(240px, 1.4fr) repeat(3, minmax(140px, .65fr)) auto;
      align-items: end;
      gap: .5rem;
    }

    .tracker-table-wrap { max-height: 68vh; }

    .tracker-table th,
    .tracker-table td { text-align: center; }

    .tracker-table .col-player {
      min-width: 190px;
      max-width: 260px;
      text-align: left;
    }

    .tracker-table .col-team { min-width: 74px; }
    .tracker-table .col-number { min-width: 64px; }
    .tracker-table .col-status { min-width: 96px; }

    .tracker-sort {
      width: 100%;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      font-weight: inherit;
      letter-spacing: inherit;
      text-align: inherit;
      text-transform: inherit;
    }

    .tracker-sort::after { content: ""; display: inline-block; margin-left: .28rem; }
    .tracker-sort[data-direction="asc"]::after { content: "▲"; font-size: .52rem; }
    .tracker-sort[data-direction="desc"]::after { content: "▼"; font-size: .52rem; }

    .tracker-player,
    .tracker-team {
      color: var(--ui-team);
      font-weight: 850;
      text-decoration: none;
    }

    .tracker-player:hover,
    .tracker-team:hover { text-decoration: underline; text-underline-offset: 2px; }

    .tracker-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 42px;
      border: 1px solid var(--ui-line);
      background: var(--ui-soft);
      padding: .14rem .3rem;
      color: var(--ui-ink);
      font-size: .72rem;
      font-weight: 950;
    }

    .tracker-count--used { border-color: #e1c17b; background: #fff8e5; color: var(--tracker-used); }
    .tracker-count--max { border-color: #efc0bb; background: #fff0ee; color: var(--tracker-max); }

    .tracker-source {
      margin-left: .25rem;
      color: var(--ui-warn);
      font-size: .62rem;
      font-weight: 900;
    }

    .tracker-footer-note {
      margin: .55rem 0 0;
      color: var(--ui-muted);
      font-size: .69rem;
    }

    @media (max-width: 850px) {
      .tracker-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tracker-filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tracker-filters .tracker-search { grid-column: 1 / -1; }
      .tracker-filters .ui-button { width: 100%; }
    }

    @media (max-width: 560px) {
      .ui-page { padding: .5rem; }
      .ui-identity-banner { grid-template-columns: 1fr; }
      .ui-actions { justify-content: stretch; }
      .ui-actions .ui-button { flex: 1; }
      .tracker-summary,
      .tracker-filters { grid-template-columns: 1fr; }
      .tracker-filters .tracker-search { grid-column: auto; }
      .tracker-table-wrap { max-height: none; }
    }

    html[data-theme="dark"] .tracker-count--used { background: #382e17; color: #f1d286; }
    html[data-theme="dark"] .tracker-count--max { background: #421f23; color: #ffaaa1; }
  </style>
</head>
<body class="ui-page">
  <main class="ui-shell tracker-shell">
    <header class="ui-identity-banner">
      <div class="tracker-banner-copy">
        <div class="tracker-banner-mark" aria-hidden="true">ESL</div>
        <div class="ui-identity-copy">
          <p class="ui-kicker">League Tools</p>
          <h1 class="ui-title">Regular Camp Tracker</h1>
          <p class="ui-subtitle">Career Regular Camps used by every player on a current ESL roster.</p>
        </div>
      </div>
      <nav class="ui-actions" aria-label="Camp tools">
        <a class="ui-button" href="./camps.htm">Submission Planner</a>
      </nav>
    </header>

    <section class="tracker-summary" aria-label="Camp tracker summary">
      <div class="tracker-metric"><span class="tracker-metric-label">Rostered Players</span><strong class="tracker-metric-value" id="totalPlayers">—</strong></div>
      <div class="tracker-metric"><span class="tracker-metric-label">No Camps Used</span><strong class="tracker-metric-value" id="unusedPlayers">—</strong></div>
      <div class="tracker-metric"><span class="tracker-metric-label">1–2 Camps Used</span><strong class="tracker-metric-value" id="usedPlayers">—</strong></div>
      <div class="tracker-metric tracker-metric--max"><span class="tracker-metric-label">Career Max</span><strong class="tracker-metric-value" id="maxedPlayers">—</strong></div>
    </section>

    <section class="ui-panel ui-panel--padded">
      <div class="tracker-filters">
        <label class="ui-field tracker-search">
          <span class="ui-label">Player Search</span>
          <input class="ui-input" id="playerSearch" type="search" placeholder="Search by player name">
        </label>
        <label class="ui-field">
          <span class="ui-label">Team</span>
          <select class="ui-select" id="teamFilter"><option value="">All teams</option></select>
        </label>
        <label class="ui-field">
          <span class="ui-label">Camp Status</span>
          <select class="ui-select" id="statusFilter">
            <option value="">All statuses</option>
            <option value="available">Camp available</option>
            <option value="unused">0 used</option>
            <option value="used">1–2 used</option>
            <option value="maxed">Maxed out</option>
          </select>
        </label>
        <label class="ui-field">
          <span class="ui-label">Rows</span>
          <select class="ui-select" id="rowLimit">
            <option value="50">50</option>
            <option value="100">100</option>
            <option value="all">All</option>
          </select>
        </label>
        <button class="ui-button" id="resetFilters" type="button">Reset</button>
      </div>
    </section>

    <section class="ui-panel ui-panel--padded">
      <div class="ui-panel-head">
        <h2 class="ui-panel-title">Player Camp Usage</h2>
        <p class="ui-panel-note" id="resultCount">Loading tracker</p>
      </div>
      <div class="ui-table-wrap tracker-table-wrap" id="tableRoot">
        <div class="ui-state ui-state--loading">Loading camp data</div>
      </div>
      <p class="tracker-footer-note" id="sourceNote">Players without a tracker entry count as 0 camps used.</p>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var PLAYERS_PATH = "../../00-build/database/players.json";
      var TEAMS_PATH = "../../00-build/database/teams.json";
      var TRACKER_PATH = "../../00-build/database/camp_tracker.json";
      var OVERRIDES_PATH = "../data/regular-camp-overrides.json";
      var state = {
        rows: [],
        teams: new Map(),
        limit: 3,
        sort: "used",
        direction: "desc"
      };

      function byId(id) { return document.getElementById(id); }

      function esc(value) {
        if (window.ESLUnifiedUI && ESLUnifiedUI.escapeHtml) return ESLUnifiedUI.escapeHtml(value);
        return String(value == null ? "" : value).replace(/[&<>"']/g, function (character) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[character];
        });
      }

      function clean(value) { return String(value == null ? "" : value).replace(/\s+/g, " ").trim(); }
      function normalizeName(value) { return clean(value).toLowerCase().replace(/[^a-z0-9]+/g, ""); }
      function numberValue(value) { var number = Number(value); return Number.isFinite(number) ? number : 0; }

      function loadJson(path) {
        return fetch(path, { cache: "no-store" }).then(function (response) {
          if (!response.ok) throw new Error("Unable to load " + path);
          return response.json();
        }).catch(function () { return loadJsonFromFrame(path); });
      }

      function loadJsonFromFrame(path) {
        return new Promise(function (resolve, reject) {
          var frame = document.createElement("iframe");
          frame.hidden = true;
          frame.setAttribute("aria-hidden", "true");
          frame.src = path;
          frame.addEventListener("load", function () {
            var raw = "";
            try {
              raw = frame.contentDocument && frame.contentDocument.body ? frame.contentDocument.body.textContent : "";
              frame.remove();
              resolve(JSON.parse(String(raw || "").replace(/^\uFEFF/, "").trim()));
            } catch (error) {
              frame.remove();
              reject(error);
            }
          });
          frame.addEventListener("error", function () {
            frame.remove();
            reject(new Error("Unable to load " + path));
          });
          document.body.appendChild(frame);
        });
      }

      function playerHref(player) {
        var match = String(player.playerId || player.url || "").match(/player(\d+)/i);
        return match ? "./unified-player.htm?id=player" + encodeURIComponent(match[1]) : "#";
      }

      function teamHref(player) {
        return /^roster\d+$/i.test(String(player.team || ""))
          ? "./unified-roster.htm?file=" + encodeURIComponent(player.team + ".htm")
          : "#";
      }

      function teamAbbreviation(name) {
        return window.ESLUnifiedUI && typeof ESLUnifiedUI.teamAbbreviation === "function"
          ? ESLUnifiedUI.teamAbbreviation(name)
          : clean(name).split(/\s+/).map(function (part) { return part.charAt(0); }).join("").slice(0, 3).toUpperCase();
      }

      function overrideRecord(player, overrides) {
        var byIdMap = overrides && overrides.byPlayerId && typeof overrides.byPlayerId === "object" ? overrides.byPlayerId : {};
        var byName = overrides && overrides.byName && typeof overrides.byName === "object" ? overrides.byName : {};
        if (Object.prototype.hasOwnProperty.call(byIdMap, player.playerId)) return byIdMap[player.playerId];
        var key = Object.keys(byName).find(function (name) { return normalizeName(name) === normalizeName(player.name); });
        return key ? byName[key] : undefined;
      }

      function regularValue(record) {
        return numberValue(record && typeof record === "object" ? record.regular : record);
      }

      function buildRows(players, tracker, overrides) {
        var tracked = tracker && tracker.players && typeof tracker.players === "object" ? tracker.players : {};
        var configuredLimit = Number(overrides && overrides.careerLimit || tracker && tracker.careerLimits && tracker.careerLimits.regular);
        state.limit = Number.isInteger(configuredLimit) && configuredLimit > 0 ? configuredLimit : 3;

        return (Array.isArray(players) ? players : []).filter(function (player) {
          return /^roster\d+$/i.test(String(player.team || ""));
        }).map(function (player) {
          var manual = overrideRecord(player, overrides || {});
          var hasManual = manual !== undefined;
          var record = hasManual ? manual : tracked[player.playerId];
          var used = Math.max(0, Math.min(state.limit, regularValue(record)));
          return {
            player: player,
            teamName: clean(player.teamLabel || state.teams.get(player.team) || player.team),
            used: used,
            remaining: Math.max(0, state.limit - used),
            manual: hasManual
          };
        });
      }

      function renderTeamFilter() {
        var selected = byId("teamFilter").value;
        var teams = Array.from(new Map(state.rows.map(function (row) {
          return [row.player.team, row.teamName];
        }))).sort(function (left, right) { return left[1].localeCompare(right[1]); });
        byId("teamFilter").innerHTML = '<option value="">All teams</option>' + teams.map(function (team) {
          return '<option value="' + esc(team[0]) + '"' + (team[0] === selected ? " selected" : "") + '>' + esc(team[1]) + "</option>";
        }).join("");
      }

      function filteredRows() {
        var query = normalizeName(byId("playerSearch").value);
        var team = byId("teamFilter").value;
        var status = byId("statusFilter").value;
        var rows = state.rows.filter(function (row) {
          if (query && normalizeName(row.player.name).indexOf(query) < 0) return false;
          if (team && row.player.team !== team) return false;
          if (status === "available" && row.used >= state.limit) return false;
          if (status === "unused" && row.used !== 0) return false;
          if (status === "used" && (row.used <= 0 || row.used >= state.limit)) return false;
          if (status === "maxed" && row.used < state.limit) return false;
          return true;
        });

        rows.sort(function (left, right) {
          var result = 0;
          if (state.sort === "player") result = left.player.name.localeCompare(right.player.name, undefined, { sensitivity: "base" });
          else if (state.sort === "team") result = left.teamName.localeCompare(right.teamName, undefined, { sensitivity: "base" });
          else if (state.sort === "pos") result = String(left.player.pos || "").localeCompare(String(right.player.pos || ""));
          else if (state.sort === "age") result = numberValue(left.player.age) - numberValue(right.player.age);
          else if (state.sort === "overall") result = numberValue(left.player.overall) - numberValue(right.player.overall);
          else if (state.sort === "remaining") result = left.remaining - right.remaining;
          else result = left.used - right.used;
          if (!result) result = left.player.name.localeCompare(right.player.name, undefined, { sensitivity: "base" });
          return state.direction === "asc" ? result : -result;
        });
        return rows;
      }

      function sortHeader(label, key, className) {
        var active = state.sort === key;
        return '<th class="' + esc(className || "") + '"><button class="tracker-sort" type="button" data-sort="' + esc(key) + '"' +
          (active ? ' data-direction="' + esc(state.direction) + '"' : "") + '>' + esc(label) + "</button></th>";
      }

      function statusMarkup(row) {
        if (row.used >= state.limit) return '<span class="ui-status ui-status--bad">MAXED</span>';
        if (row.used > 0) return '<span class="ui-status ui-status--warn">' + row.remaining + ' LEFT</span>';
        return '<span class="ui-status ui-status--good">AVAILABLE</span>';
      }

      function renderSummary() {
        var unused = state.rows.filter(function (row) { return row.used === 0; }).length;
        var maxed = state.rows.filter(function (row) { return row.used >= state.limit; }).length;
        byId("totalPlayers").textContent = state.rows.length;
        byId("unusedPlayers").textContent = unused;
        byId("usedPlayers").textContent = state.rows.length - unused - maxed;
        byId("maxedPlayers").textContent = maxed;
      }

      function renderTable() {
        var filtered = filteredRows();
        var rowSetting = byId("rowLimit").value;
        var visible = rowSetting === "all" ? filtered : filtered.slice(0, numberValue(rowSetting) || 50);
        var body = visible.map(function (row) {
          var player = row.player;
          var countClass = row.used >= state.limit ? " tracker-count--max" : (row.used > 0 ? " tracker-count--used" : "");
          var playerLink = '<a class="tracker-player" href="' + esc(playerHref(player)) + '">' + esc(player.name) + "</a>";
          var teamLink = '<a class="tracker-team" href="' + esc(teamHref(player)) + '" title="' + esc(row.teamName) + '">' + esc(teamAbbreviation(row.teamName)) + "</a>";
          return "<tr>" +
            '<td class="col-player ui-sticky">' + playerLink + (row.manual ? '<span class="tracker-source" title="Manual override">MANUAL</span>' : "") + "</td>" +
            '<td class="col-team">' + teamLink + "</td>" +
            '<td class="col-number">' + esc(player.pos || "—") + "</td>" +
            '<td class="col-number">' + esc(player.age || "—") + "</td>" +
            '<td class="col-number">' + (window.ESLUnifiedUI ? ESLUnifiedUI.ratingBadge(player.overall, player.overall || "—") : esc(player.overall || "—")) + "</td>" +
            '<td class="col-number"><span class="tracker-count' + countClass + '">' + row.used + "/" + state.limit + "</span></td>" +
            '<td class="col-number">' + row.remaining + "</td>" +
            '<td class="col-status">' + statusMarkup(row) + "</td>" +
          "</tr>";
        }).join("");

        byId("resultCount").textContent = visible.length === filtered.length
          ? filtered.length + " players"
          : "Showing " + visible.length + " of " + filtered.length + " players";

        if (!visible.length) {
          byId("tableRoot").innerHTML = '<div class="ui-state">No players match these filters.</div>';
          return;
        }

        byId("tableRoot").innerHTML = '<table class="ui-table ui-table--sticky-first tracker-table"><thead><tr>' +
          sortHeader("Player", "player", "col-player ui-sticky") +
          sortHeader("Team", "team", "col-team") +
          sortHeader("Pos", "pos", "col-number") +
          sortHeader("Age", "age", "col-number") +
          sortHeader("OVR", "overall", "col-number") +
          sortHeader("Camps", "used", "col-number") +
          sortHeader("Left", "remaining", "col-number") +
          '<th class="col-status">Status</th></tr></thead><tbody>' + body + "</tbody></table>";

        Array.prototype.slice.call(document.querySelectorAll("[data-sort]")).forEach(function (button) {
          button.addEventListener("click", function () {
            var key = button.getAttribute("data-sort");
            if (state.sort === key) state.direction = state.direction === "asc" ? "desc" : "asc";
            else {
              state.sort = key;
              state.direction = ["player", "team", "pos"].indexOf(key) >= 0 ? "asc" : "desc";
            }
            renderTable();
          });
        });
      }

      function bindFilters() {
        ["teamFilter", "statusFilter", "rowLimit"].forEach(function (id) {
          byId(id).addEventListener("change", renderTable);
        });
        byId("playerSearch").addEventListener("input", renderTable);
        byId("resetFilters").addEventListener("click", function () {
          byId("playerSearch").value = "";
          byId("teamFilter").value = "";
          byId("statusFilter").value = "";
          byId("rowLimit").value = "50";
          state.sort = "used";
          state.direction = "desc";
          renderTable();
        });
      }

      Promise.all([
        loadJson(PLAYERS_PATH),
        loadJson(TEAMS_PATH),
        loadJson(TRACKER_PATH),
        loadJson(OVERRIDES_PATH).catch(function () { return {}; })
      ]).then(function (data) {
        (Array.isArray(data[1]) ? data[1] : []).forEach(function (team) { state.teams.set(team.id, team.name); });
        state.rows = buildRows(data[0], data[2] || {}, data[3] || {});
        renderTeamFilter();
        renderSummary();
        bindFilters();
        renderTable();
        var fetched = data[2] && data[2].source && data[2].source.fetchedAtUtc;
        if (fetched) byId("sourceNote").textContent += " Tracker built " + new Date(fetched).toLocaleString() + ".";
      }).catch(function (error) {
        byId("tableRoot").innerHTML = '<div class="ui-state ui-state--error">' + esc(error.message || "Unable to load camp tracker data.") + "</div>";
        byId("resultCount").textContent = "Tracker unavailable";
      });
    }());
  </script>
</body>
</html>
