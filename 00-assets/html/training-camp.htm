<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=0.35, maximum-scale=5.0, user-scalable=yes">
  <title>Training Camp Changes</title>
  <link rel="icon" type="image/png" href="../../00-build/database/favicon.png">
  <script src="../js/theme-preload.js"></script>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/unified-components.css">
  <script src="../js/core.js" defer></script>
  <script src="../js/settings.js" defer></script>
  <script src="../js/unified-ui.js?v=team-abbreviations-1"></script>
  <style>
    :root {
      --ink: var(--ui-ink);
      --blue: var(--ui-team);
      --paper: var(--ui-paper);
      --card: var(--ui-card);
      --line: var(--ui-line);
      --muted: var(--ui-muted);
      --green: var(--ui-good);
      --red: var(--ui-bad);
      --tc-table-header: var(--blue);
      --font-sans: var(--ui-font);
    }

    body {
      margin: 0;
      font-size: 14px;
      padding: .85rem;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--font-sans);
    }

    .tc-shell {
      display: grid;
      gap: .75rem;
      max-width: min(1600px, calc(100vw - 1.7rem));
      min-width: 0;
      width: 100%;
    }

    .tc-header {
      align-items: center;
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 5px solid var(--blue);
      display: grid;
      gap: .8rem;
      grid-template-columns: minmax(0, 1fr) auto;
      padding: .8rem .9rem;
    }

    .tc-kicker {
      color: var(--blue);
      color: var(--ui-team-secondary);
      font-size: .66rem;
      font-weight: 900;
      letter-spacing: .14em;
      margin: 0 0 .16rem;
      text-transform: uppercase;
    }

    .tc-title {
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 1.55rem;
      font-weight: 900;
      letter-spacing: -.025em;
      line-height: 1.05;
      margin: 0;
    }

    .tc-subtitle {
      color: var(--muted);
      font-size: .79rem;
      font-weight: 700;
      margin: .25rem 0 0;
    }

    .tc-controls {
      align-items: end;
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
    }

    .tc-control {
      display: grid;
      gap: .22rem;
    }

    .tc-label {
      color: var(--muted);
      font-size: .68rem;
      font-weight: 900;
      letter-spacing: .055em;
      text-transform: uppercase;
    }

    .tc-select,
    .tc-button {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--ink);
      font: inherit;
      font-size: .78rem;
      height: 36px;
      padding: .42rem .5rem;
    }

    .tc-select {
      min-width: 185px;
    }

    .tc-select--rows {
      min-width: 82px;
    }

    .tc-button {
      align-items: center;
      background: var(--card);
      color: var(--blue);
      cursor: pointer;
      display: inline-flex;
      font-size: .76rem;
      font-weight: 850;
      letter-spacing: 0;
      justify-content: center;
      padding: .4rem .58rem;
      text-decoration: none;
      text-transform: none;
    }

    .tc-button:hover {
      background: var(--ui-soft);
      border-color: var(--blue);
    }

    .tc-button:disabled {
      cursor: not-allowed;
      opacity: .52;
    }

    .tc-panel {
      background: var(--card);
      border: 1px solid var(--line);
      padding: .7rem;
    }

    .tc-panel-head {
      align-items: center;
      border-bottom: 1px solid var(--line);
      display: flex;
      flex-wrap: wrap;
      gap: .55rem;
      justify-content: space-between;
      margin-bottom: .6rem;
      min-height: 34px;
      padding: .15rem 0 .55rem;
    }

    .tc-panel-title {
      color: var(--blue);
      font-size: .72rem;
      font-weight: 950;
      letter-spacing: .12em;
      margin: 0;
      text-transform: uppercase;
    }

    .tc-status {
      color: var(--muted);
      font-size: .72rem;
      font-weight: 400;
      letter-spacing: 0;
    }

    .tc-summary {
      display: flex;
      flex-wrap: wrap;
      gap: .45rem;
      margin-bottom: .72rem;
    }

    .tc-chip {
      background: var(--ui-soft);
      border: 1px solid var(--line);
      color: var(--muted);
      display: grid;
      gap: .1rem;
      min-width: 96px;
      padding: .42rem .52rem;
    }

    .tc-chip span {
      font-size: .58rem;
      font-weight: 900;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .tc-chip strong {
      color: var(--blue);
      font-size: 1rem;
    }

    .tc-chip--positive strong { color: var(--green); }
    .tc-chip--negative strong { color: var(--red); }

    .tc-table-wrap {
      border: 1px solid var(--line);
      max-height: none;
      overflow: auto;
    }

    .tc-table {
      border-collapse: separate;
      border-spacing: 0;
      font-size: .82rem;
      min-width: 1250px;
      overflow: visible;
      width: 100%;
    }

    .tc-table th {
      background: var(--tc-table-header);
      border-bottom: 1px solid #263352;
      color: #fff;
      font-size: .66rem;
      font-weight: 900;
      height: 35px;
      letter-spacing: .11em;
      padding: 0 .35rem;
      position: sticky;
      text-align: center;
      text-transform: uppercase;
      top: 0;
      z-index: 3;
    }

    .tc-table th:first-child,
    .tc-table th:nth-child(2) {
      text-align: left;
    }

    .tc-sort-button {
      align-items: center;
      background: transparent;
      border: 0;
      color: inherit;
      cursor: pointer;
      display: inline-flex;
      font: inherit;
      font-weight: inherit;
      gap: .22rem;
      justify-content: inherit;
      letter-spacing: inherit;
      padding: 0;
      text-transform: inherit;
    }

    .tc-sort-button::after {
      content: "";
      font-size: .54rem;
      min-width: .48rem;
      opacity: .72;
    }

    .tc-sort-button[data-direction="desc"]::after { content: "\25BC"; }
    .tc-sort-button[data-direction="asc"]::after { content: "\25B2"; }

    .tc-sort-button:focus {
      outline: 1px solid rgba(255, 255, 255, .85);
      outline-offset: 2px;
    }

    .tc-table td {
      background: var(--card);
      border-bottom: 1px solid var(--line);
      height: 34px;
      padding: 0 .35rem;
      text-align: center;
      white-space: nowrap;
    }

    .tc-table tr:hover td:not(.delta) {
      background: color-mix(in srgb, var(--blue) 7%, var(--card));
    }

    .tc-table .col-player {
      background: var(--card);
      box-shadow: 1px 0 0 var(--line);
      left: 0;
      max-width: 176px;
      min-width: 176px;
      position: sticky;
      text-align: left;
      width: 176px;
      z-index: 4;
    }

    .tc-table th.col-player {
      background: var(--tc-table-header);
      z-index: 6;
    }

    .tc-table .col-team {
      max-width: 70px;
      min-width: 70px;
      text-align: left;
      width: 70px;
    }

    .tc-table .col-camp { min-width: 82px; }
    .tc-table .col-pos { min-width: 38px; }
    .tc-table .col-age { min-width: 38px; }
    .tc-table .col-rating { min-width: 47px; }
    .tc-table .col-key { border-left: 2px solid #c8bfae; min-width: 50px; }
    .tc-table .col-net { border-left: 2px solid #c8bfae; font-weight: 800; min-width: 55px; }

    .tc-player {
      color: var(--ink);
      display: block;
      font-family: var(--font-sans);
      font-size: .82rem;
      font-weight: 850;
      overflow: hidden;
      text-decoration: none;
      text-overflow: ellipsis;
    }

    .tc-player:hover,
    .tc-team:hover {
      color: var(--blue);
      text-decoration: underline;
    }

    .tc-team {
      color: var(--muted);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    .delta {
      font-size: .84rem;
      font-weight: 700;
    }

    .tc-delta-trigger {
      align-items: center;
      background: transparent;
      border: 0;
      color: inherit;
      cursor: help;
      display: inline-flex;
      flex-direction: column;
      font: inherit;
      font-weight: inherit;
      gap: .08rem;
      justify-content: center;
      line-height: 1;
      min-height: 30px;
      min-width: 100%;
      padding: 0;
    }

    .tc-delta-trigger:focus {
      outline: 2px solid currentColor;
      outline-offset: -2px;
    }

    .tc-delta-values {
      display: none;
      font-size: .53rem;
      font-weight: 700;
      letter-spacing: .03em;
    }

    .tc-delta-trigger:focus .tc-delta-values {
      display: block;
    }

    .delta--positive {
      background: #dceccf !important;
      color: #166534;
    }

    .delta--positive.delta--strong {
      background: #9bc379 !important;
    }

    .delta--negative {
      background: #f7d4d4 !important;
      color: #991b1b;
    }

    .delta--negative.delta--strong {
      background: #ed9a9a !important;
    }

    .tc-empty {
      color: var(--muted);
      font-size: .86rem;
      padding: 2.3rem .6rem;
      text-align: center;
    }

    html[data-theme="dark"] .delta--positive { background: #183d28 !important; color: #8ee0aa; }
    html[data-theme="dark"] .delta--positive.delta--strong { background: #245638 !important; }
    html[data-theme="dark"] .delta--negative { background: #4a2424 !important; color: #ffaaa3; }
    html[data-theme="dark"] .delta--negative.delta--strong { background: #67302f !important; }

    @media (max-width: 760px) {
      body { padding: .45rem; }
      .tc-header { grid-template-columns: 1fr; padding: .7rem; }
      .tc-controls { align-items: stretch; }
      .tc-select { min-width: 0; width: 100%; }
      .tc-table-wrap { max-height: none; }
    }
  </style>
</head>
<body class="ui-page">
  <main class="tc-shell ui-shell">
    <header class="tc-header ui-identity-banner">
      <div>
        <p class="tc-kicker ui-kicker">Player Development</p>
        <h1 class="tc-title ui-title">Training Camp Changes</h1>
        <p class="tc-subtitle ui-subtitle" id="viewSubtitle">Current ratings compared with the pre-camp player snapshot. Positive movement is green; regression is red.</p>
      </div>
      <div class="tc-controls">
        <label class="tc-control">
          <span class="tc-label">Training Camp</span>
          <select class="tc-select" id="campPicker" aria-label="Choose training camp"></select>
        </label>
        <label class="tc-control">
          <span class="tc-label">Team View</span>
          <select class="tc-select" id="teamPicker" aria-label="Choose team"></select>
        </label>
        <label class="tc-control">
          <span class="tc-label">Rows</span>
          <select class="tc-select tc-select--rows" id="rowLimit" aria-label="Rows per page">
            <option value="50" selected>50</option>
            <option value="100">100</option>
            <option value="250">250</option>
            <option value="all">All</option>
          </select>
        </label>
        <button class="tc-button" id="exportCsv" type="button" disabled title="Export every row in the active camp and team filter">Export CSV</button>
        <a class="tc-button" href="./league%20dashboard.htm">Back To Dashboard</a>
      </div>
    </header>

    <section class="tc-panel ui-panel ui-panel--padded">
      <div class="tc-panel-head ui-panel-head">
        <h2 class="tc-panel-title ui-panel-title" id="viewTitle">All Teams</h2>
        <span class="tc-status ui-panel-note" id="statusText">Loading rating snapshots</span>
      </div>
      <div class="tc-summary" id="summary"></div>
      <div class="tc-table-wrap ui-table-wrap" id="tableRoot"></div>
    </section>
  </main>

  <script>
    (function () {
      "use strict";

      var CURRENT_URL = "../../00-build/database/players.json";
      var PREVIOUS_URL = "../../00-build/database/PreTC/players.json";
      var HISTORY_ROOT = "../../00-build/history/";
      var HISTORY_INDEX_URL = HISTORY_ROOT + "index.json";
      var SKILLS = [
        { key: "Ins", label: "Ins" }, { key: "Jps", label: "Jps" },
        { key: "Fts", label: "Fts" }, { key: "3ps", label: "3ps" },
        { key: "Hnd", label: "Hnd" }, { key: "Pas", label: "Pas" },
        { key: "Orb", label: "Orb" }, { key: "Drb", label: "Drb" },
        { key: "Psd", label: "Psd" }, { key: "Prd", label: "Prd" },
        { key: "Stl", label: "Stl" }, { key: "Blk", label: "Blk" },
        { key: "Qkn", label: "Qkn" }, { key: "Jmp", label: "Jmp" },
        { key: "Str", label: "Str" }, { key: "Sta", label: "Sta" }
      ];
      var KEY_RATINGS = [
        { key: "overall", label: "Ovr" },
        { key: "potential", label: "Pot" }
      ];
      var MINIMUM_OVR = 50;
      var state = {
        rows: [],
        team: "__ALL__",
        rowLimit: 50,
        sort: "team",
        direction: "asc",
        view: "current",
        viewLabel: "Current TC",
        camps: [],
        campById: {},
        cache: {},
        loadRequest: 0,
        colorByTeam: {},
        colorRequest: 0
      };

      function esc(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function valueOf(player, key) {
        var number = Number(player && player[key]);
        return Number.isFinite(number) ? number : 0;
      }

      function playerId(player) {
        return String(player && (player.url || player.name) || "").toLowerCase();
      }

      function playerFile(player) {
        var match = String(player && (player.url || player.playerId) || "").match(/(player\d+)(?:\.htm)?/i);
        return match ? match[1].toLowerCase() + ".htm" : "";
      }

      function mappedIdentity(player, keyMap) {
        var file = playerFile(player);
        return keyMap && file && keyMap[file] ? String(keyMap[file]) : playerId(player);
      }

      function playerHref(row) {
        var player = row.player;
        if (row.historical && row.identityKey && !/^\.\.\/players\//i.test(row.identityKey)) {
          return "./history/player.htm?key=" + encodeURIComponent(row.identityKey);
        }
        var match = String(player.url || "").match(/player(\d+)\.htm/i);
        return match ? "./unified-player.htm?id=player" + encodeURIComponent(match[1]) : "";
      }

      function teamHref(player) {
        return player.team && player.team !== "FA"
          ? "./unified-roster.htm?file=" + encodeURIComponent(player.team + ".htm")
          : "";
      }

      function teamAbbreviation(value) {
        var helper = window.ESLUnifiedUI && window.ESLUnifiedUI.teamAbbreviation;
        var name = String(value || "").trim();
        if (typeof helper === "function") return helper(name);
        if (name === "FA") return "FA";
        return name.split(/\s+/).filter(Boolean).map(function (part) {
          return part.charAt(0);
        }).join("").slice(0, 3).toUpperCase() || "---";
      }

      function teamMarkup(player) {
        var fullName = player.teamLabel || player.team || "FA";
        var abbreviation = teamAbbreviation(fullName);
        var href = teamHref(player);
        return href
          ? '<a class="tc-team" href="' + esc(href) + '" title="' + esc(fullName) + '" aria-label="' + esc(fullName) + '">' + esc(abbreviation) + "</a>"
          : '<span class="tc-team" title="' + esc(fullName) + '" aria-label="' + esc(fullName) + '">' + esc(abbreviation) + "</span>";
      }

      function formatDelta(delta) {
        return delta > 0 ? "+" + delta : (delta < 0 ? String(delta) : "");
      }

      function deltaClass(delta) {
        if (!delta) return "delta";
        var tone = delta > 0 ? "delta delta--positive" : "delta delta--negative";
        return Math.abs(delta) >= 3 ? tone + " delta--strong" : tone;
      }

      function calculateRows(current, previous, config) {
        var currentKeys = config.currentKeys || null;
        var previousKeys = config.previousKeys || null;
        var priorById = new Map(previous.map(function (player) {
          return [mappedIdentity(player, previousKeys), player];
        }));

        return current.map(function (player) {
          if (valueOf(player, "overall") < MINIMUM_OVR) return null;
          var identityKey = mappedIdentity(player, currentKeys);
          var prior = priorById.get(identityKey);
          if (!prior) return null;
          var deltas = {};
          SKILLS.concat(KEY_RATINGS).forEach(function (column) {
            deltas[column.key] = valueOf(player, column.key) - valueOf(prior, column.key);
          });
          var hasChange = SKILLS.concat(KEY_RATINGS).some(function (column) {
            return deltas[column.key] !== 0;
          });
          if (!hasChange) return null;
          var total = SKILLS.reduce(function (sum, column) {
            return sum + deltas[column.key];
          }, 0);
          return {
            player: player,
            prior: prior,
            deltas: deltas,
            total: total,
            identityKey: identityKey,
            campId: config.id,
            campLabel: config.label,
            campSort: config.sortOrder,
            historical: Boolean(config.historical)
          };
        }).filter(Boolean);
      }

      function visibleRows() {
        var rows = state.team === "__ALL__" ? state.rows : state.rows.filter(function (row) {
          return row.player.team === state.team;
        });
        return sortRows(rows);
      }

      function compareName(left, right) {
        var team = String(left.player.teamLabel || "").localeCompare(String(right.player.teamLabel || ""));
        return team || String(left.player.name || "").localeCompare(String(right.player.name || "")) || (right.campSort - left.campSort);
      }

      function compareText(left, right, key) {
        return String(left.player[key] || "").localeCompare(String(right.player[key] || ""), undefined, { numeric: true, sensitivity: "base" });
      }

      function sortRows(rows) {
        return rows.slice().sort(function (left, right) {
          var direction = state.direction === "asc" ? 1 : -1;
          if (state.sort === "player") return direction * String(left.player.name || "").localeCompare(String(right.player.name || ""), undefined, { sensitivity: "base" });
          if (state.sort === "camp") return direction * (left.campSort - right.campSort) || compareName(left, right);
          if (state.sort === "pos") return direction * compareText(left, right, "pos") || compareName(left, right);
          if (state.sort === "age") return direction * (valueOf(left.player, "age") - valueOf(right.player, "age")) || compareName(left, right);
          if (state.sort === "net") return direction * (left.total - right.total) || compareName(left, right);
          if (state.sort === "overall") return direction * (left.deltas.overall - right.deltas.overall) || direction * (left.total - right.total) || compareName(left, right);
          if (state.sort === "potential") return direction * (left.deltas.potential - right.deltas.potential) || direction * (left.total - right.total) || compareName(left, right);
          if (SKILLS.some(function (column) { return column.key === state.sort; })) {
            return direction * (left.deltas[state.sort] - right.deltas[state.sort]) || direction * (left.total - right.total) || compareName(left, right);
          }
          return compareName(left, right);
        });
      }

      function extractTeamColor(htmlText) {
        var style = (String(htmlText || "").match(/<style[^>]*>([\s\S]*?)<\/style>/i) || [])[1] || "";
        var match = style.match(/td\.teamheader\s*\{[^}]*background:\s*([^;]+);/i);
        return match ? String(match[1]).trim() : "#111b36";
      }

      function setTableHeaderColor() {
        var selectedTeam = state.team;
        var request = ++state.colorRequest;
        if (selectedTeam === "__ALL__" || selectedTeam === "FA") {
          document.documentElement.style.setProperty("--tc-table-header", "#111b36");
          return;
        }
        if (state.colorByTeam[selectedTeam]) {
          document.documentElement.style.setProperty("--tc-table-header", state.colorByTeam[selectedTeam]);
          return;
        }
        fetch("../../rosters/" + encodeURIComponent(selectedTeam) + ".htm", { cache: "no-store" })
          .then(function (response) {
            if (!response.ok) throw new Error("Team color could not be loaded.");
            return response.text();
          })
          .then(function (htmlText) {
            var color = extractTeamColor(htmlText);
            state.colorByTeam[selectedTeam] = color;
            if (request === state.colorRequest && state.team === selectedTeam) {
              document.documentElement.style.setProperty("--tc-table-header", color);
            }
          })
          .catch(function () {
            if (request === state.colorRequest && state.team === selectedTeam) {
              document.documentElement.style.setProperty("--tc-table-header", "#111b36");
            }
          });
      }

      function linkMarkup(href, className, text) {
        return href ? '<a class="' + className + '" href="' + esc(href) + '">' + esc(text) + "</a>" : esc(text);
      }

      function renderRatingDelta(row, column) {
        var delta = row.deltas[column.key];
        var keyClass = column.key === "overall" ? " col-key" : "";
        if (!delta) {
          return '<td class="delta col-rating' + keyClass + '"></td>';
        }
        var before = valueOf(row.prior, column.key);
        var after = valueOf(row.player, column.key);
        var title = column.label + ": " + before + " -> " + after;
        return '<td class="' + deltaClass(delta) + " col-rating" + keyClass + '">' +
          '<button class="tc-delta-trigger" type="button" title="' + esc(title) + '" aria-label="' + esc(column.label + " change " + formatDelta(delta) + ", " + before + " to " + after) + '">' +
            '<span>' + esc(formatDelta(delta)) + "</span>" +
            '<span class="tc-delta-values">' + esc(before + " > " + after) + "</span>" +
          "</button></td>";
      }

      function sortHeader(label, key, headerClass) {
        var active = state.sort === key;
        var direction = active ? state.direction : "";
        var ariaSort = active ? (key === "team" ? "ascending" : (state.direction === "desc" ? "descending" : "ascending")) : "none";
        return '<th class="' + headerClass + '" aria-sort="' + ariaSort + '">' +
          '<button class="tc-sort-button" type="button" data-sort="' + key + '" data-direction="' + direction + '">' + label + "</button></th>";
      }

      function bindSortHeaders() {
        Array.prototype.slice.call(document.querySelectorAll(".tc-sort-button")).forEach(function (button) {
          button.addEventListener("click", function () {
            var nextSort = button.getAttribute("data-sort");
            if (nextSort === "team") {
              state.sort = "team";
              state.direction = "asc";
            } else if (state.sort === nextSort) {
              state.direction = state.direction === "desc" ? "asc" : "desc";
            } else {
              state.sort = nextSort;
              state.direction = ["player", "pos", "age"].indexOf(nextSort) >= 0 ? "asc" : "desc";
            }
            render();
          });
        });
      }

      function renderSummary(rows) {
        var improved = rows.filter(function (row) { return row.total > 0; }).length;
        var declined = rows.filter(function (row) { return row.total < 0; }).length;
        var total = rows.reduce(function (sum, row) { return sum + row.total; }, 0);
        var uniquePlayers = new Set(rows.map(function (row) { return row.identityKey || playerId(row.player); })).size;
        var firstLabel = state.view === "all-time" ? "Camp Entries" : "Players Changed";
        var uniqueChip = state.view === "all-time"
          ? '<div class="tc-chip"><span>Unique Players</span><strong>' + uniquePlayers + "</strong></div>"
          : "";
        document.getElementById("summary").innerHTML =
          '<div class="tc-chip"><span>' + firstLabel + '</span><strong>' + rows.length + "</strong></div>" +
          uniqueChip +
          '<div class="tc-chip tc-chip--positive"><span>Net Improvers</span><strong>' + improved + "</strong></div>" +
          '<div class="tc-chip tc-chip--negative"><span>Net Decliners</span><strong>' + declined + "</strong></div>" +
          '<div class="tc-chip ' + (total < 0 ? "tc-chip--negative" : "tc-chip--positive") + '"><span>Total Skill Delta</span><strong>' + esc(formatDelta(total) || "0") + "</strong></div>";
      }

      function renderTable(rows) {
        var root = document.getElementById("tableRoot");
        if (!rows.length) {
          root.innerHTML = '<div class="tc-empty">No rating changes found for this team in the two player snapshots.</div>';
          return;
        }

        var heads = SKILLS.concat(KEY_RATINGS).map(function (column) {
          var keyClass = column.key === "overall" ? " col-key" : "";
          return sortHeader(column.label, column.key, "col-rating" + keyClass);
        }).join("");
        var showCamp = state.view === "all-time";
        var body = rows.map(function (row) {
          var player = row.player;
          var ratings = SKILLS.concat(KEY_RATINGS).map(function (column) {
            return renderRatingDelta(row, column);
          }).join("");
          return "<tr>" +
            '<td class="col-player ui-sticky">' + linkMarkup(playerHref(row), "tc-player", player.name) + "</td>" +
            (showCamp ? '<td class="col-camp">' + esc(row.campLabel) + "</td>" : "") +
            '<td class="col-team">' + teamMarkup(player) + "</td>" +
            '<td class="col-pos">' + esc(player.pos || "") + "</td>" +
            '<td class="col-age">' + esc(player.age || "") + "</td>" +
            ratings +
            '<td class="' + deltaClass(row.total) + ' col-net">' + esc(formatDelta(row.total) || "0") + "</td>" +
          "</tr>";
        }).join("");

        root.innerHTML = '<table class="tc-table ui-table ui-table--sticky-first"><thead><tr>' +
          sortHeader("Player", "player", "col-player ui-sticky") + (showCamp ? sortHeader("Camp", "camp", "col-camp") : "") + sortHeader("Team", "team", "col-team") + sortHeader("Pos", "pos", "col-pos") + sortHeader("Age", "age", "col-age") +
          heads +
          sortHeader("Net", "net", "col-net") + "</tr></thead><tbody>" + body + "</tbody></table>";
        bindSortHeaders();
      }

      function render() {
        var rows = visibleRows();
        var displayedRows = state.rowLimit === "all" ? rows : rows.slice(0, state.rowLimit);
        var picker = document.getElementById("teamPicker");
        var selectedLabel = picker.options[picker.selectedIndex] ? picker.options[picker.selectedIndex].textContent : "All Teams";
        document.getElementById("viewTitle").textContent = selectedLabel + " · " + state.viewLabel;
        document.getElementById("statusText").textContent = displayedRows.length === rows.length
          ? rows.length + (state.view === "all-time" ? " player-camp entries" : " players changed")
          : "Showing " + displayedRows.length + " of " + rows.length + (state.view === "all-time" ? " player-camp entries" : " players changed");
        renderSummary(rows);
        renderTable(displayedRows);
        setTableHeaderColor();
      }

      function refreshTeamPicker(rows) {
        var picker = document.getElementById("teamPicker");
        var previousSelection = state.team;
        var teams = Array.from(new Map(rows.map(function (row) {
          var player = row.player;
          return [player.team, player.teamLabel || player.team || "Free Agents"];
        })).entries()).sort(function (a, b) {
          return String(a[1]).localeCompare(String(b[1]));
        });
        picker.innerHTML = '<option value="__ALL__">All Teams</option>' + teams.map(function (team) {
          return '<option value="' + esc(team[0]) + '">' + esc(team[1]) + "</option>";
        }).join("");
        var canPreserve = teams.some(function (team) { return team[0] === previousSelection; });
        state.team = canPreserve ? previousSelection : "__ALL__";
        picker.value = state.team;
      }

      function initializeTeamPicker() {
        var picker = document.getElementById("teamPicker");
        picker.addEventListener("change", function () {
          state.team = picker.value;
          render();
        });
      }

      function initializeRowLimit() {
        var picker = document.getElementById("rowLimit");
        picker.addEventListener("change", function () {
          state.rowLimit = picker.value === "all" ? "all" : Number(picker.value);
          render();
        });
      }

      function fetchJson(url, message) {
        return fetch(url, { cache: "no-store" }).then(function (response) {
          if (!response.ok) throw new Error(message || ("Could not load " + url));
          return response.json();
        });
      }

      function seasonNumber(season) {
        var match = String(season || "").match(/\d+/);
        return match ? Number(match[0]) : 0;
      }

      function transitionLabel(previousSeason, currentSeason) {
        return "S" + seasonNumber(previousSeason) + "-S" + seasonNumber(currentSeason);
      }

      function buildCampConfigs(historyIndex) {
        var seasons = Array.isArray(historyIndex && historyIndex.seasons) ? historyIndex.seasons : [];
        var latestSeasonNumber = seasons.reduce(function (latest, season) {
          return Math.max(latest, seasonNumber(season.season));
        }, 0);
        var currentLabel = latestSeasonNumber
          ? "S" + latestSeasonNumber + "-S" + (latestSeasonNumber + 1)
          : "Current TC";
        var current = {
          id: "current",
          label: currentLabel,
          description: currentLabel + " ratings compared with the saved pre-camp snapshot.",
          currentUrl: CURRENT_URL,
          previousUrl: PREVIOUS_URL,
          sortOrder: latestSeasonNumber + 1 || 1,
          historical: false
        };
        var historical = [];
        for (var index = seasons.length - 1; index >= 1; index -= 1) {
          var target = seasons[index];
          var previous = seasons[index - 1];
          var base = HISTORY_ROOT + target.season + "/database/";
          var previousBase = HISTORY_ROOT + previous.season + "/database/";
          historical.push({
            id: "history-" + target.season,
            label: transitionLabel(previous.season, target.season),
            description: transitionLabel(previous.season, target.season) + " training-camp movement.",
            currentUrl: base + "players.json",
            previousUrl: previousBase + "players.json",
            currentKeysUrl: base + "player_history_keys.json",
            previousKeysUrl: previousBase + "player_history_keys.json",
            sortOrder: index + 1,
            historical: true
          });
        }
        var allTime = {
          id: "all-time",
          label: "All-Time TCs",
          description: "Every recorded training camp combined. Each row is one player in one camp.",
          sortOrder: 999,
          historical: true
        };
        state.camps = [current, allTime].concat(historical);
        state.campById = {};
        state.camps.forEach(function (camp) { state.campById[camp.id] = camp; });
      }

      function populateCampPicker() {
        var picker = document.getElementById("campPicker");
        picker.innerHTML = state.camps.map(function (camp) {
          return '<option value="' + esc(camp.id) + '">' + esc(camp.label) + "</option>";
        }).join("");
        picker.value = state.view;
        picker.addEventListener("change", function () {
          loadView(picker.value);
        });
      }

      function loadCamp(config) {
        if (state.cache[config.id]) return Promise.resolve(state.cache[config.id]);
        var requests = [
          fetchJson(config.currentUrl, config.label + " current snapshot could not be loaded."),
          fetchJson(config.previousUrl, config.label + " previous snapshot could not be loaded.")
        ];
        if (config.currentKeysUrl && config.previousKeysUrl) {
          requests.push(fetchJson(config.currentKeysUrl, config.label + " identity map could not be loaded."));
          requests.push(fetchJson(config.previousKeysUrl, config.label + " previous identity map could not be loaded."));
        }
        return Promise.all(requests).then(function (data) {
          var rows = calculateRows(data[0], data[1], {
            id: config.id,
            label: config.label,
            sortOrder: config.sortOrder,
            historical: config.historical,
            currentKeys: data[2] && data[2].keys ? data[2].keys : null,
            previousKeys: data[3] && data[3].keys ? data[3].keys : null
          });
          state.cache[config.id] = rows;
          return rows;
        });
      }

      function setLoading(isLoading) {
        document.getElementById("campPicker").disabled = isLoading;
        document.getElementById("teamPicker").disabled = isLoading;
        document.getElementById("exportCsv").disabled = isLoading || !state.rows.length;
        if (isLoading) document.getElementById("statusText").textContent = "Loading rating snapshots";
      }

      function loadView(viewId) {
        var config = state.campById[viewId] || state.campById.current;
        var request = ++state.loadRequest;
        setLoading(true);
        var rowsPromise;
        if (config.id === "all-time") {
          rowsPromise = Promise.all(state.camps.filter(function (camp) {
            return camp.id !== "all-time";
          }).map(loadCamp)).then(function (groups) {
            return groups.reduce(function (rows, group) { return rows.concat(group); }, []);
          });
        } else {
          rowsPromise = loadCamp(config);
        }
        rowsPromise.then(function (rows) {
          if (request !== state.loadRequest) return;
          state.view = config.id;
          state.viewLabel = config.label;
          state.rows = rows;
          document.getElementById("campPicker").value = config.id;
          document.getElementById("viewSubtitle").textContent = config.description + " Positive movement is green; regression is red.";
          refreshTeamPicker(rows);
          setLoading(false);
          render();
        }).catch(function (error) {
          if (request !== state.loadRequest) return;
          setLoading(false);
          document.getElementById("statusText").textContent = "Unable to load";
          document.getElementById("tableRoot").innerHTML = '<div class="tc-empty">' + esc(error.message || "Unable to load rating snapshots.") + "</div>";
        });
      }

      function csvCell(value) {
        var text = String(value == null ? "" : value);
        return /[",\r\n]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
      }

      function fileSlug(value) {
        return String(value || "training-camp").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      }

      function exportCsv() {
        var rows = visibleRows();
        if (!rows.length) return;
        var headers = ["Camp", "Player", "Team", "Position", "Age", "OVR Before", "OVR After", "OVR Delta", "POT Before", "POT After", "POT Delta"]
          .concat(SKILLS.map(function (column) { return column.label + " Delta"; }))
          .concat(["Net Skill Delta"]);
        var lines = [headers.map(csvCell).join(",")];
        rows.forEach(function (row) {
          var values = [
            row.campLabel,
            row.player.name || "",
            row.player.teamLabel || row.player.team || "",
            row.player.pos || "",
            row.player.age || "",
            valueOf(row.prior, "overall"),
            valueOf(row.player, "overall"),
            row.deltas.overall,
            valueOf(row.prior, "potential"),
            valueOf(row.player, "potential"),
            row.deltas.potential
          ].concat(SKILLS.map(function (column) { return row.deltas[column.key]; })).concat([row.total]);
          lines.push(values.map(csvCell).join(","));
        });
        var blob = new Blob(["\uFEFF" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        var teamLabel = state.team === "__ALL__" ? "all-teams" : fileSlug(document.getElementById("teamPicker").selectedOptions[0].textContent);
        link.href = url;
        link.download = "training-camp-" + fileSlug(state.viewLabel) + "-" + teamLabel + ".csv";
        document.body.appendChild(link);
        link.click();
        link.remove();
        window.setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        document.getElementById("statusText").textContent = "Exported " + rows.length + " filtered rows";
      }

      function initialize() {
        initializeTeamPicker();
        initializeRowLimit();
        document.getElementById("exportCsv").addEventListener("click", exportCsv);
        fetchJson(HISTORY_INDEX_URL, "Historical season index could not be loaded.").then(function (historyIndex) {
          buildCampConfigs(historyIndex);
          populateCampPicker();
          loadView("current");
        }).catch(function (error) {
          document.getElementById("statusText").textContent = "Unable to load";
          document.getElementById("tableRoot").innerHTML = '<div class="tc-empty">' + esc(error.message || "Unable to load training-camp history.") + "</div>";
        });
      }

      initialize();
    }());
  </script>
</body>
</html>
